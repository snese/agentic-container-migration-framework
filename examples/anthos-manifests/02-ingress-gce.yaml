# Sample Anthos Ingress (gce-internal) + Service with NEG annotation + BackendConfig.
# Apply rules: ingress_class_to_alb, ingress_alb_annotations,
#              drop_neg_annotation, drop_backend_config, drop_app_protocols.
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: payment-api-bc
  namespace: payments
spec:
  timeoutSec: 30
  connectionDraining: { drainingTimeoutSec: 60 }
  healthCheck:
    requestPath: /healthz
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: payments
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "payment-api-bc"}'
    cloud.google.com/app-protocols: '{"https": "HTTPS"}'
spec:
  type: ClusterIP
  selector:
    app: payment-api
  ports:
    - name: https
      port: 443
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-api-ingress
  namespace: payments
  annotations:
    kubernetes.io/ingress.class: gce-internal
    networking.gke.io/managed-certificates: payment-cert
spec:
  rules:
    - host: pay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-api
                port: { number: 443 }
